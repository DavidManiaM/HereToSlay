# The base game, as data.
#
# This is the file a variant most wants to fork. Every number here is policy,
# not mechanism: the Python engine only knows how to *walk* these tables.
# A later pack can override any of it (deep merge, list entries merged by id).

id: base

classes: [bard, fighter, guardian, ranger, thief, wizard]

setup:
  starting_hand: 5
  monster_row_size: 3
  leader_selection: random
  min_players: 2
  max_players: 6

turn:
  action_points_per_turn: 3
  hand_limit: null # null = no limit
  # Run after every resolved action. *When* a new Monster turns up is policy,
  # so it lives here rather than inside slay_monster.
  after_action:
    - { op: refill_monster_row }

# --------------------------------------------------------------------------
# Zones — cards live in exactly one of these, always.
# --------------------------------------------------------------------------
zones:
  - { id: main_deck, scope: shared, visibility: hidden, ordered: true }
  - { id: discard, scope: shared, visibility: public, ordered: true }
  - { id: monster_deck, scope: shared, visibility: hidden, ordered: true }
  - { id: monster_row, scope: shared, visibility: public, ordered: true, capacity: 3 }
  - { id: leader_pool, scope: shared, visibility: hidden, ordered: true }
  # in-flight cards, mid-resolution: a Challenge must know where to send them
  - { id: limbo, scope: shared, visibility: public, ordered: false }
  - { id: hand, scope: player, visibility: owner, ordered: false }
  - { id: party, scope: player, visibility: public, ordered: false }
  - { id: leader, scope: player, visibility: public, ordered: false }
  - { id: slain, scope: player, visibility: public, ordered: false }

# --------------------------------------------------------------------------
# The action menu. Add, remove or re-cost freely; both UIs follow.
#
# `targets:` is what makes the menu itself data: the engine expands each action
# into one intent per legal combination, so "which Heroes may I play?" is a
# selector plus a filter, never a Python branch. An action whose target has no
# candidates is not offered at all.
# --------------------------------------------------------------------------
actions:
  - id: draw
    label: "Draw a card"
    cost: { action_points: 1 }
    effect: { op: draw, target: $self, count: 1 }

  - id: play_hero
    label: "Play a Hero"
    cost: { action_points: 1 }
    targets:
      - param: card
        from: { selector: cards, of: { player: $self, zone: hand } }
        where: { op: card_kind_is, kind: hero }
        prompt: "Play which Hero?"
    effect:
      op: play_card_from_hand
      card: $intent.card
      kind: hero
      challengeable: true

  - id: use_hero_ability
    label: "Use a Hero's ability"
    cost: { action_points: 1 }
    targets:
      - param: card
        from: { selector: heroes, of: $self }
        where:
          op: all
          of:
            - { op: card_has_ability, activation: action }
            - { op: not, of: { op: card_tapped } }
        prompt: "Use which Hero's ability?"
    effect: { op: use_ability, card: $intent.card }

  - id: attack_monster
    label: "Attack a Monster"
    cost: { action_points: 2 }
    targets:
      - param: target
        from: { selector: monster_row }
        where: { op: requirement_met, player: $self }
        prompt: "Attack which Monster?"
    effect: { op: attack_monster, monster: $intent.target, attacker: $self }

  - id: equip_item
    label: "Equip an Item"
    cost: { action_points: 1 }
    targets:
      - param: card
        from: { selector: cards, of: { player: $self, zone: hand } }
        where: { op: card_kind_is, kind: item }
        prompt: "Equip which Item?"
    # Which Hero it may go to is the Item's own business (`equip.to`), so the
    # op asks rather than the menu enumerating heroes it might not allow.
    effect:
      op: play_card_from_hand
      card: $intent.card
      kind: item
      challengeable: true

  - id: cast_magic
    label: "Cast a Magic card"
    cost: { action_points: 1 }
    targets:
      - param: card
        from: { selector: cards, of: { player: $self, zone: hand } }
        where: { op: card_kind_is, kind: magic }
        prompt: "Cast which Magic card?"
    effect:
      op: play_card_from_hand
      card: $intent.card
      kind: magic
      challengeable: true

  # Shipped off. A variant flips this to true — no Python involved.
  - id: discard_and_draw
    label: "Discard your hand, draw that many plus one"
    cost: { action_points: 3 }
    enabled: false
    effect: { op: noop }

# --------------------------------------------------------------------------
# Turn structure. TurnMachine only knows how to walk this table.
# --------------------------------------------------------------------------
phases:
  - id: turn_start
    auto_advance: true
    on_enter:
      - op: set_action_points
        target: $active_player
        value: { expr: "$rules.turn.action_points_per_turn" }

  - id: main
    loop_while: { op: compare, left: $action_points, cmp: ">", right: 0 }
    allows:
      [draw, play_hero, use_hero_ability, attack_monster, equip_item, cast_magic]

  - id: turn_end
    auto_advance: true
    on_enter:
      - { op: enforce_hand_limit, target: $active_player }

# --------------------------------------------------------------------------
# Reaction windows. A variant may add its own and a card that reacts to it.
#
# `on:` + `timing:` say when a window opens; the bus opens it *inside* that
# event's dispatch, which is what lets a Challenge cancel the very play it is
# challenging. A window declared with no `on:` never opens by itself.
# --------------------------------------------------------------------------
windows:
  card_played:
    on: card.played
    timing: pre
    order: seat_left_of_active
    reopen_on_action: true
    # `challengeable: false` (a reaction card, or an action that says so) keeps
    # the window shut without the engine knowing the word.
    condition: { op: compare, left: $event.challengeable, cmp: "==", right: true }

  roll_modification:
    # Opens after the dice have landed and before the band is chosen, so a
    # Modifier played here changes which outcome happens.
    on: roll.resolved
    timing: pre
    order: seat_left_of_active
    reopen_on_action: true

max_reaction_depth: 8

# --------------------------------------------------------------------------
# Victory — checked after every event resolution, not just at end of turn.
# --------------------------------------------------------------------------
victory:
  - id: slay_three
    text: "Slay 3 Monsters"
    condition: { op: slain_count, player: $player, cmp: ">=", value: 3 }

  - id: full_party
    text: "Have a Hero of each class in your party"
    condition: { op: party_covers_all_classes, player: $player }

tiebreak: active_player
