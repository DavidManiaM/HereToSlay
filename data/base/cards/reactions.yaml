# ==========================================================================
# Challenge
# ==========================================================================

- id: base.challenge.challenge
  kind: challenge
  name: "Șia all in"
  copies: 7
  art: ref/here_to_vibe/images/by_type/challenges/challenge.png
  text: >-
    Oprește jucarea unui Erou / Obiect / Script. Ambii aruncă; provocatorul
    câștigă la egalitate.
  reaction:
    window: card_played
    challengeable: false
    condition:
      op: all
      of:
        - { op: event_matches, kind_in: [hero, item, magic], played_by: { op: not_self } }
        # "Each card can only be challenged once" — the flag is set on the card
        # being played, so a second Challenge in the same window is not offered.
        - { op: not, of: { op: flag_set, scope: card, key: challenged, target: $event.card } }
    effect:
      op: seq
      steps:
        - { op: set_flag, scope: card, key: challenged, target: $event.card, value: true }
        - op: emit
          event: challenge.declared
          payload: { card: $event.card, defender: $event.player }
        - op: contest_roll
          a: { roller: $self, dice: "2d6", kind: challenge }
          b: { roller: $event.player, dice: "2d6", kind: challenge }
          # The rulebook is explicit: "If your roll is equal to or higher than
          # the other player's roll, the card being challenged is moved to the
          # discard pile." So a tie goes to the CHALLENGER, not the defender.
          on_a_wins: { op: cancel_event, and_discard: true, reason: "Challenged" }
          on_tie: { op: cancel_event, and_discard: true, reason: "Challenged (tie)" }
          on_b_wins: { op: noop }
