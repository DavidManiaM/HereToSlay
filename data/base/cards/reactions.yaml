# Modifier and Challenge cards — the two reaction kinds.
#
# Neither is ever an *action*: they cost no action points and are played out of
# turn into an open window declared in rules.yaml. That is why they have a
# `reaction:` block instead of `play:` and never appear in the action menu.
#
# Deck arithmetic for the 121-card main deck:
#     48 Heroes (1 each) + 12 Items (6x2) + 6 CIDR masks + 16 Magic (8x2)
#   + 32 Modifiers (4x8) + 7 Challenges = 121
# The 48/12/16 counts follow from confirmed card lists; the 32/7 split is
# UNVERIFIED — I could not find a primary source for how many Modifier and
# Challenge cards the box holds, so these are chosen to hit the printed 115.

# ==========================================================================
# Modifiers
# ==========================================================================
#
# A Modifier is playable by anybody, on anybody's roll, any number per roll.
# The card does not know what it is modifying: `modify_roll` reaches whatever
# roll is in flight (core/effects/rolls.py), which is what lets the same card
# swing a Hero ability, a Monster attack or a Challenge contest.
#
# Each card offers two options, per the rulebook: "simply declare the option you
# wish to use on the current roll." `choose_effect` is that declaration.

- id: base.modifier.plus_one_minus_three
  kind: modifier
  name: "+1 / -3"
  copies: 8
  text: "Add 1 or subtract 3 from any roll."
  reaction:
    window: roll_modification
    challengeable: false
    effect:
      op: choose_effect
      chooser: $self
      prompt: "Apply which?"
      options:
        - { label: "+1", effect: { op: modify_roll, amount: 1, source: $card } }
        - { label: "-3", effect: { op: modify_roll, amount: -3, source: $card } }

