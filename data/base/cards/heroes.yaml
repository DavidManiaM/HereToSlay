- id: base.hero.pan_chucks
  kind: hero
  name: "Pan Chucks"
  card_class: fighter
  copies: 1
  text: >-
    DRAW 2 cards. If at least one of those cards is a Challenge card, you may
    reveal it, then DESTROY a Hero card.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 8
          tag: success
          effect:
            op: draw
            target: $self
            count: 2
            bind: drawn
            then:
              op: if
              condition:
                op: has_card
                player: $self
                zone: hand
                filter: { op: card_kind_is, kind: challenge }
                min: 1
              then:
                op: seq
                steps:
                  - op: choose
                    bind: victim
                    chooser: $self
                    from: { selector: opponents, of: $self }
                    prompt: "Destroy a Hero belonging to whom?"
                  - { op: destroy_hero, target: $victim, chooser: $self }
              else: { op: noop }
        - { max: 7, tag: failure, effect: { op: noop } }

- id: base.hero.qi_bear
  kind: hero
  name: "Qi Bear"
  card_class: fighter
  copies: 1
  text: "DISCARD up to 3 cards. For each card discarded, DESTROY a Hero card."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 10
          tag: success
          effect:
            op: choose_effect
            chooser: $self
            prompt: "Qi Bear: discard how many?"
            options:
              - label: "None"
                effect: { op: noop }
              - label: "1 card, destroy 1 Hero"
                effect:
                  op: seq
                  steps:
                    - { op: discard, target: $self, count: 1, chooser: $self }
                    - op: choose
                      bind: victim
                      chooser: $self
                      from: { selector: opponents, of: $self }
                      prompt: "Destroy a Hero belonging to whom?"
                    - { op: destroy_hero, target: $victim, chooser: $self }
              - label: "2 cards, destroy 2 Heroes"
                effect:
                  op: seq
                  steps:
                    - { op: discard, target: $self, count: 2, chooser: $self }
                    - op: repeat
                      times: 2
                      effect:
                        op: seq
                        steps:
                          - op: choose
                            bind: victim
                            chooser: $self
                            from: { selector: opponents, of: $self }
                            prompt: "Destroy a Hero belonging to whom?"
                          - { op: destroy_hero, target: $victim, chooser: $self }
              - label: "3 cards, destroy 3 Heroes"
                effect:
                  op: seq
                  steps:
                    - { op: discard, target: $self, count: 3, chooser: $self }
                    - op: repeat
                      times: 3
                      effect:
                        op: seq
                        steps:
                          - op: choose
                            bind: victim
                            chooser: $self
                            from: { selector: opponents, of: $self }
                            prompt: "Destroy a Hero belonging to whom?"
                          - { op: destroy_hero, target: $victim, chooser: $self }
        - { max: 9, tag: failure, effect: { op: noop } }

- id: base.hero.tough_teddy
  kind: hero
  name: "Tough Teddy"
  card_class: fighter
  copies: 1
  text: "Each other player with a Fighter in their Party must DISCARD a card."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 4
          tag: success
          effect:
            op: for_each
            over: { selector: opponents, of: $self }
            bind: other
            effect:
              op: if
              condition: { op: party_has_class, player: $other, class: fighter, min: 1 }
              then: { op: discard, target: $other, count: 1, chooser: $other }
              else: { op: noop }
        - { max: 3, tag: failure, effect: { op: noop } }

# ==========================================================================
# BARD
# ==========================================================================

- id: base.hero.dodgy_dealer
  kind: hero
  name: "Dodgy Dealer"
  card_class: bard
  copies: 1
  text: "Trade hands with another player."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 9
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: partner
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Trade hands with whom?"
              - op: swap_zones
                a: { player: $self, zone: hand }
                b: { player: $partner, zone: hand }
        - { max: 8, tag: failure, effect: { op: noop } }

- id: base.hero.fuzzy_cheeks
  kind: hero
  name: "Fuzzy Cheeks"
  card_class: bard
  copies: 1
  text: "DRAW a card and play a Hero card from your hand immediately."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 8
          tag: success
          effect:
            op: seq
            steps:
              - { op: draw, target: $self, count: 1 }
              # Guarded rather than `choose optional:` — an optional choose that
              # binds nothing leaves $hero unresolvable, and play_card_from_hand
              # then fails with "expected exactly one card". Ask only when there
              # is something to ask about.
              - op: if
                condition:
                  op: has_card
                  player: $self
                  zone: hand
                  filter: { op: card_kind_is, kind: hero }
                  min: 1
                then:
                  op: seq
                  steps:
                    - op: choose
                      bind: hero
                      chooser: $self
                      from:
                        selector: cards
                        of: { player: $self, zone: hand }
                        where: { op: card_kind_is, kind: hero }
                      prompt: "Play which Hero immediately?"
                    # Free, and uncontestable: it is this Hero's effect
                    # resolving, not a fresh play action.
                    - { op: play_card_from_hand, card: $hero, kind: hero, challengeable: false }
                else: { op: noop }
        - { max: 7, tag: failure, effect: { op: noop } }

- id: base.hero.greedy_cheeks
  kind: hero
  name: "Greedy Cheeks"
  card_class: bard
  copies: 1
  text: "Each other player must give you a card from their hand."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 8
          tag: success
          effect:
            op: for_each
            over: { selector: opponents, of: $self }
            bind: other
            # `chooser: $other` is what makes this "give" rather than "pull":
            # they pick which card leaves their hand.
            effect:
              op: steal_card
              from: $other
              to: $self
              count: 1
              random: false
              chooser: $other
        - { max: 7, tag: failure, effect: { op: noop } }

- id: base.hero.lucky_bucky
  kind: hero
  name: "Lucky Bucky"
  card_class: bard
  copies: 1
  text: >-
    Pull a card from another player's hand. If it is a Hero card, you may play
    it immediately.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 7
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Pull a card from whose hand?"
              - op: steal_card
                from: $victim
                to: $self
