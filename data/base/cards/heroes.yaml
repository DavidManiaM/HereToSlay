      kind: hero_ability
      outcomes:
        - { min: 7, tag: success, effect: { op: draw, target: $self, count: 2 } }
        - { max: 6, tag: failure, effect: { op: noop } }

- id: base.hero.tipsy_tootie
  kind: hero
  name: "Tipsy Tootie"
  card_class: bard
  copies: 1
  text: >-
    Choose a player. STEAL a Hero card from that player's Party, then move this
    card to that player's Party.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 6
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Swap Heroes with whom?"
              - { op: steal_hero, from: $victim, to: $self, chooser: $self }
              - { op: move_card, card: $card, to: { player: $victim, zone: party } }
        - { max: 5, tag: failure, effect: { op: noop } }

# ==========================================================================
# GUARDIAN
# ==========================================================================

- id: base.hero.calming_voice
  kind: hero
  name: "Calming Voice"
  card_class: guardian
  copies: 1
  text: "Hero cards in your Party cannot be stolen until your next turn."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 9
          tag: success
          effect: { op: set_flag, scope: player, key: heroes_unstealable, target: $self, value: true }
        - { max: 8, tag: failure, effect: { op: noop } }
  triggers:
    # A steal is "leaves my party for somewhere that is not the discard".
    - on: hero.left_party
      timing: pre
      while_in: party
      condition:
        op: all
        of:
          - { op: flag_set, scope: player, key: heroes_unstealable, target: $self }
          - { op: compare, left: $event.player, cmp: "==", right: $self }
          - { op: compare, left: $event.to, cmp: "!=", right: discard }
      effect: { op: cancel_event, reason: "Calming Voice" }
    # "Until your next turn" — so it lapses as that turn begins, not at the end
    # of the turn it was played on.
    - on: turn.started
      timing: post
      while_in: party
      condition: { op: event_actor_is, player: $self }
      effect: { op: clear_flag, scope: player, key: heroes_unstealable, target: $self }

- id: base.hero.guiding_light
  kind: hero
  name: "Guiding Light"
  card_class: guardian
  copies: 1
  text: "Search the discard pile for a Hero card and add it to your hand."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 7
          tag: success
          effect:
            op: search
            zone: { zone: discard }
            filter: { op: card_kind_is, kind: hero }
            count: 1
            chooser: $self
            bind: found
            then: { op: move_card, card: $found, to: { player: $self, zone: hand } }
        - { max: 6, tag: failure, effect: { op: noop } }

- id: base.hero.holy_curselifter
  kind: hero
  name: "Holy Curselifter"
  card_class: guardian
  copies: 1
  text: "Return a Cursed Item card equipped to a Hero card in your Party to your hand."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 5
          tag: success
          effect:
            op: search
            zone: { player: $self, zone: party }
            filter: { op: card_has_tag, tag: cursed }
            count: 1
            chooser: $self
            bind: curse
            then: { op: unequip_item, item: $curse, to_zone: { player: $self, zone: hand } }
        - { max: 4, tag: failure, effect: { op: noop } }

- id: base.hero.iron_resolve
  kind: hero
  name: "Iron Resolve"
  card_class: guardian
  copies: 1
  text: "Cards you play cannot be challenged for the rest of your turn."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        # rules.yaml's card_played window reads this flag, which is how the bus
        # stays ignorant of the word "challenge".
        - min: 8
          tag: success
          effect: { op: set_flag, scope: player, key: uncontestable, target: $self, value: true }
        - { max: 7, tag: failure, effect: { op: noop } }
  triggers:
    - on: turn.ended
      timing: post
      while_in: party
      condition: { op: event_actor_is, player: $self }
      effect: { op: clear_flag, scope: player, key: uncontestable, target: $self }

- id: base.hero.mighty_blade
  kind: hero
  name: "Mighty Blade"
  card_class: guardian
  copies: 1
  text: "Hero cards in your Party cannot be destroyed until your next turn."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 8
          tag: success
          effect:
            op: set_flag
            scope: player
            key: heroes_indestructible
            target: $self
            value: true
        - { max: 7, tag: failure, effect: { op: noop } }
  triggers:
    - on: hero.left_party
      timing: pre
      while_in: party
      condition:
        op: all
        of:
          - { op: flag_set, scope: player, key: heroes_indestructible, target: $self }
          - { op: compare, left: $event.player, cmp: "==", right: $self }
          - { op: compare, left: $event.to, cmp: "==", right: discard }
          # A sacrifice is your own doing, so it is still allowed.
          - { op: not, of: { op: event_actor_is, player: $self } }
      effect: { op: cancel_event, reason: "Mighty Blade" }
    - on: turn.started
      timing: post
      while_in: party
      condition: { op: event_actor_is, player: $self }
      effect: { op: clear_flag, scope: player, key: heroes_indestructible, target: $self }

