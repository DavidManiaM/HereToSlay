  text: "Choose a player. That player must DISCARD 2 cards."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 5
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Who discards 2 cards?"
              - { op: discard, target: $victim, count: 2, chooser: $victim }
