          tag: success
          effect:
            op: draw
            target: $self
            count: 1
            bind: drawn
            then:
              op: if
              condition: { op: card_kind_is, card: $drawn, kind: hero }
              then:
                op: optional
                chooser: $self
                prompt: "Play that Hero immediately?"
                effect:
                  op: play_card_from_hand
                  card: $drawn
                  kind: hero
                  challengeable: false
              else: { op: noop }
