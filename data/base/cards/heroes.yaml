- id: base.hero.napping_nibbles
  kind: hero
  name: "Napping Nibbles"
  card_class: bard
  copies: 1
  text: "Do nothing."
  # Genuinely the printed card. Its 2+ threshold means the roll never fails,
  # which makes it a useful smoke test: an ability that always takes its top
  # band and always does nothing.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        # A bare catch-all, not `min: 2`. Bands are validated against the
        # *natural* dice range, but a Modifier can push a total outside it —
        # a -3 on a roll of 2 gives -1, which `min: 2` does not cover, and the
        # roll then raises mid-game. Every other card here already has an
        # open-ended bottom band; this one needs the same.
        - { tag: success, effect: { op: noop } }

- id: base.hero.peanut
  kind: hero
  name: "Peanut"
  card_class: bard
  copies: 1
  text: "DRAW 2 cards."
  ability:
