# Heroes — 48 cards, 8 per class, one copy each.
#
# Every Hero is the same shape: a class, and an `ability` whose `roll` has one
# band at the printed roll requirement and one below it that does nothing. The
# threshold *is* the band boundary — nothing in Python compares a total to a
# number, which is why "this Hero needs 7+" is a YAML edit.
#
# `activation: action` + `once_per_turn: true` is the base rule: a Hero may be
# used once per turn, and a failed roll still spends the action point (the
# engine taps before resolving, see core/effects/actions.py:_use_ability).
#
# The `cost:` below is the *only* charge — the `use_hero_ability` action itself
# costs nothing. A Hero that entered your party this turn activates for free:
# `turn.ability_free_when` in rules.yaml waives this block on the turn the Hero
# arrived, so playing a Hero and using it costs 1 point in total, not 2.
#
# Recurring idioms worth knowing before reading:
#   * "pull a card"  -> steal_card with random: true. A pull is blind; a
#     *chosen* take out of a hidden hand would be `random: false`.
#   * "if that card is a X" -> the `bind:`/`then:` pair on draw/steal_card.
#   * "+N to your rolls until end of turn" -> the ability sets a player flag and
#     a second trigger on the same card reads it during roll.started, then a
#     turn.ended trigger clears it. Three small declarative parts instead of one
#     bespoke "lasting effect" concept in the engine.
#
# UNVERIFIED values are marked inline. Both card wikis block automated fetches,
# so a handful of thresholds and effects could not be confirmed against a
# primary source; they are mechanically sensible, and correcting one is a
# one-line edit here. See docs/rules_reference.md §7.

# ==========================================================================
# FIGHTER
# ==========================================================================

- id: base.hero.bad_axe
  kind: hero
  name: "Bad Axe"
  card_class: fighter
  copies: 1
  text: "DESTROY a Hero card."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 8
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Destroy a Hero belonging to whom?"
              - { op: destroy_hero, target: $victim, chooser: $self }
        - { max: 7, tag: failure, effect: { op: noop } }

- id: base.hero.bear_claw
  kind: hero
  name: "Bear Claw"
  card_class: fighter
  copies: 1
  text: >-
    Pull a card from another player's hand. If it is a Hero card, pull a second
    card from that player's hand.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 7
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Pull a card from whose hand?"
              - op: steal_card
                from: $victim
                to: $self
                count: 1
                random: true
                bind: pulled
                then:
                  op: if
                  condition: { op: card_kind_is, card: $pulled, kind: hero }
                  then: { op: steal_card, from: $victim, to: $self, count: 1, random: true }
                  else: { op: noop }
        - { max: 6, tag: failure, effect: { op: noop } }

- id: base.hero.beary_wise
  kind: hero
  name: "Beary Wise"
  card_class: fighter
  copies: 1
  text: >-
    Each other player must DISCARD a card. Choose one of the discarded cards and
    add it to your hand.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 7
          tag: success
          effect:
            op: seq
            steps:
              - op: for_each
                over: { selector: opponents, of: $self }
                bind: other
                effect: { op: discard, target: $other, count: 1, chooser: $other }
              - op: search
                zone: { zone: discard }
                count: 1
                chooser: $self
                bind: taken
                then: { op: move_card, card: $taken, to: { player: $self, zone: hand } }
        - { max: 6, tag: failure, effect: { op: noop } }

- id: base.hero.fury_knuckle
  kind: hero
  name: "Fury Knuckle"
  card_class: fighter
  copies: 1
  text: >-
    Pull a card from another player's hand. If it is a Challenge card, pull a
    second card from that player's hand.
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 5
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Pull a card from whose hand?"
              - op: steal_card
                from: $victim
                to: $self
                count: 1
                random: true
                bind: pulled
                then:
                  op: if
                  condition: { op: card_kind_is, card: $pulled, kind: challenge }
                  then: { op: steal_card, from: $victim, to: $self, count: 1, random: true }
                  else: { op: noop }
        - { max: 4, tag: failure, effect: { op: noop } }

- id: base.hero.heavy_bear
  kind: hero
  name: "Heavy Bear"
  card_class: fighter
