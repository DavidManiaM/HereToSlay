- id: base.hero.vibrant_glow
  kind: hero
  name: "Vibrant Glow"
  card_class: guardian
  copies: 1
  text: "+5 to all your rolls until the end of your turn."
  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - { min: 9, tag: success, effect: { op: set_flag, scope: player, key: roll_bonus_5, target: $self, value: true } }
        - { max: 8, tag: failure, effect: { op: noop } }
  triggers:
    - on: roll.started
      timing: pre
