  ability:
    activation: action
    once_per_turn: true
    cost: { action_points: 1 }
    roll:
      dice: "2d6"
      kind: hero_ability
      outcomes:
        - min: 9
          tag: success
          effect:
            op: seq
            steps:
              - op: choose
                bind: victim
                chooser: $self
                from: { selector: opponents, of: $self }
                prompt: "Destroy a Hero belonging to whom?"
              - op: choose
                bind: doomed
                chooser: $self
                from: { selector: heroes, of: $victim }
                prompt: "Destroy which Hero?"
              # Salvage the Item *before* the Hero leaves, or it travels to the
              # discard with its host (the base rule for equipment).
              - op: search
                zone: { player: $victim, zone: party }
                filter: { op: card_kind_is, kind: item }
                count: 1
                chooser: $self
                bind: loot
                then: { op: unequip_item, item: $loot, to_zone: { player: $self, zone: hand } }
              - { op: move_card, card: $doomed, to: { zone: discard } }
        - { max: 8, tag: failure, effect: { op: noop } }

