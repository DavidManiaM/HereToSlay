- id: base.monster.dracos
  kind: monster
  name: "Dracos"
  copies: 1
  text: "Each time you roll to use a Hero card's effect, you may reroll the dice once."
  requirement:
    op: has_card
    player: $self
    zone: party
    filter: { op: card_kind_is, kind: hero }
    min: 2
  requirement_text: "2 Heroes of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 9, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 6, max: 8, tag: spared, effect: { op: noop } }
      - { max: 5, tag: backfire, effect: { op: sacrifice, target: $self } }
  on_slay: { op: noop }
  triggers:
    # Fires in the same window a Modifier uses: after the dice land, before the
    # band is chosen. The flag stops it offering a reroll of its own reroll.
    - on: roll.resolved
      timing: pre
      while_in: slain
      condition:
        op: all
        of:
          - { op: roll_is, kind: hero_ability }
          - { op: roll_is, roller: $self }
          - { op: not, of: { op: flag_set, scope: card, key: dracos_rerolled } }
      effect:
        op: seq
        steps:
          - { op: set_flag, scope: card, key: dracos_rerolled, value: true }
          - op: optional
            chooser: $self
            prompt: "Dracos: reroll the dice?"
            effect: { op: reroll, roller: $self }
          - { op: clear_flag, scope: card, key: dracos_rerolled }
