- id: base.monster.bloodwing
  kind: monster
  name: "Bloodwing"
  copies: 1
  text: "Each time another player CHALLENGEs you, that player must DISCARD a card."
  requirement:
    op: has_card
    player: $self
    zone: party
    filter: { op: card_kind_is, kind: hero }
    min: 2
  requirement_text: "2 Heroes of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 9, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 7, max: 8, tag: spared, effect: { op: noop } }
      - { max: 6, tag: backfire, effect: { op: sacrifice, target: $self } }
  on_slay: { op: noop }
  triggers:
    - on: challenge.declared
      timing: post
      while_in: slain
      condition:
        op: all
        of:
          - { op: compare, left: $event.defender, cmp: "==", right: $self }
          - { op: not, of: { op: event_actor_is, player: $self } }
      effect: { op: discard, target: $event.player, count: 1, chooser: $event.player }

- id: base.monster.arctic_aries
  kind: monster
  name: "Arctic Aries"
  copies: 1
  # The printed card says "each time you *successfully* roll". Bands now carry a
  # `tag:` and `roll.banded` reports which one ran, so this is the printed card
  # rather than the more generous approximation it used to be.
  text: "Each time you successfully roll to use a Hero card's effect, DRAW a card."
  requirement:
    op: has_card
    player: $self
    zone: party
    filter: { op: card_kind_is, kind: hero }
    min: 1
  requirement_text: "1 Hero of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 10, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 7, max: 9, tag: spared, effect: { op: noop } }
      - { max: 6, tag: backfire, effect: { op: sacrifice, target: $self } }
  on_slay: { op: noop }
  triggers:
    - on: roll.banded
      timing: post
      while_in: slain
      condition:
        op: all
        of:
          - { op: roll_is, kind: hero_ability, tag: success }
          - { op: roll_is, roller: $self }
      effect: { op: draw, target: $self, count: 1 }

- id: base.monster.terratuga
  kind: monster
  name: "Terratuga"
  copies: 1
  text: "Your Hero cards cannot be destroyed."
  requirement:
    op: has_card
    player: $self
    zone: party
    filter: { op: card_kind_is, kind: hero }
    min: 2
  requirement_text: "2 Heroes of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 11, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 7, max: 10, tag: spared, effect: { op: noop } }
      - { max: 6, tag: backfire, effect: { op: sacrifice, target: $self } }
  on_slay: { op: noop }
  triggers:
    # A protection, so it must land in PRE and cancel. `to: discard` is what
    # separates "destroyed" from "stolen" — a steal moves to another party.
    - on: hero.left_party
      timing: pre
      while_in: slain
      condition:
        op: all
        of:
          - { op: compare, left: $event.player, cmp: "==", right: $self }
          - { op: compare, left: $event.to, cmp: "==", right: discard }
          - { op: not, of: { op: event_actor_is, player: $self } }
      effect: { op: cancel_event, reason: "Terratuga" }

