# --------------------------------------------------------------------------
# Generic-Hero Monsters: no class demanded, only bodies
# --------------------------------------------------------------------------

- id: base.monster.mega_slime
  kind: monster
  name: "Mega Slime"
  copies: 1
  text: "You may spend an extra action point on each of your turns."
  requirement:
    op: has_card
    player: $self
    zone: party
    filter: { op: card_kind_is, kind: hero }
    min: 4
  requirement_text: "4 Heroes of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      # The nastiest bands in the row: no safe middle at all.
      - { min: 8, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { max: 7, tag: backfire, effect: { op: sacrifice, target: $self } }
  on_slay: { op: noop }
  triggers:
    - on: turn.started
      timing: post
      while_in: slain
      condition: { op: event_actor_is, player: $self }
      effect: { op: gain_action_points, target: $self, amount: 1 }

- id: base.monster.abyss_queen
  kind: monster
  name: "Abyss Queen"
  copies: 1
  text: "Each time another player plays a Modifier card on your roll, +1 to your roll."
  requirement:
    op: has_card
    player: $self
    zone: party
    filter: { op: card_kind_is, kind: hero }
    min: 3
  requirement_text: "3 Heroes of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 8, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 6, max: 7, tag: spared, effect: { op: noop } }
      - { max: 5, tag: backfire, effect: { op: sacrifice, target: $self } }
  on_slay: { op: noop }
  triggers:
    - on: roll.modified
      timing: post
      while_in: slain
      condition:
        op: all
        of:
          - { op: roll_is, roller: $self }
          - { op: event_matches, kind_in: [modifier] }
          - { op: not, of: { op: event_actor_is, player: $self } }
          - { op: not, of: { op: flag_set, scope: card, key: abyss_applied } }
      effect:
        op: seq
        steps:
          - { op: set_flag, scope: card, key: abyss_applied, value: true }
          - { op: modify_roll, amount: 1, source: $card }
          - { op: clear_flag, scope: card, key: abyss_applied }

