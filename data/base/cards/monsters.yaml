- id: base.monster.titan_wyvern
  kind: monster
  name: "Titan Wyvern"
  copies: 1
  text: "Each time you play a Hero card, +1 to your next roll this turn."
  requirement:
    op: all
    of:
      - { op: party_has_class, player: $self, class: fighter, min: 1 }
      - op: has_card
        player: $self
        zone: party
        filter: { op: card_kind_is, kind: hero }
        min: 2
  requirement_text: "1 Fighter and 1 Hero of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 8, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 5, max: 7, tag: spared, effect: { op: noop } }
      - { max: 4, tag: backfire, effect: { op: discard, target: $self, count: 2, chooser: $self } }
  on_slay: { op: noop }
  triggers:
    - on: roll.started
      timing: pre
      while_in: slain
      condition:
        op: all
        of:
          - { op: roll_is, roller: $self }
          - { op: flag_set, scope: player, key: titan_wyvern_bonus, target: $self }
      effect:
        op: seq
        steps:
          - { op: modify_roll, amount: 1, source: $card }
          - { op: clear_flag, scope: player, key: titan_wyvern_bonus, target: $self }
    - on: card.played
      timing: post
      while_in: slain
      condition:
        op: all
        of:
          - { op: event_actor_is, player: $self }
          - { op: event_matches, kind_in: [hero] }
      effect:
        op: set_flag
        scope: player
        key: titan_wyvern_bonus
        target: $self
        value: true
    - on: turn.ended
      timing: post
      while_in: slain
      effect: { op: clear_flag, scope: player, key: titan_wyvern_bonus, target: $self }

