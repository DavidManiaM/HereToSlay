# Monsters — 15 oversized cards, three face up at all times.
#
# Every Monster is the same three-part shape, and none of it is Python:
#
#   requirement:  may you even attack? (a condition, checked by the action menu
#                 via `requirement_met`, so an ineligible Monster is not offered)
#   roll.outcomes: the bands. First match wins, so they are written high-to-low.
#   on_slay:      the skill you keep for the rest of the game — modelled as the
#                 Monster's own `triggers:` firing `while_in: slain`, since a
#                 slain Monster sits in your party permanently.
#
# Requirement grammar, straight from the rulebook:
#   * "N Heroes of any class" counts Heroes only — the Party Leader does not
#     count, hence `has_card` over the party zone filtered to kind: hero.
#   * a class symbol may be satisfied by a Hero *or* the Party Leader, hence
#     `party_has_class` (see core/conditions/board.py:CLASS_BEARING_ZONES).
#   * a class symbol plus a generic symbol means both, and one Hero cannot pay
#     for both — so "wizard + any" is `party_has_class(wizard)` AND
#     `has_card(hero, min: 2)`.
#
# Bands are 2d6, so the range is 2..12. Every Monster leaves a "nothing happens"
# gap between its penalty band and its slay band; the validator proves the bands
# cover the whole range.

# --------------------------------------------------------------------------
# Two-symbol Monsters: one class, one generic Hero
# --------------------------------------------------------------------------

- id: base.monster.orthus
  kind: monster
  name: "Orthus"
  copies: 1
  text: "Each time you DRAW a Magic card, you may play it immediately."
  requirement:
    op: all
    of:
      - { op: party_has_class, player: $self, class: wizard, min: 1 }
      - op: has_card
        player: $self
        zone: party
        filter: { op: card_kind_is, kind: hero }
        min: 2
  requirement_text: "1 Wizard and 1 Hero of any class"
  roll:
    dice: "2d6"
    kind: monster_attack
    outcomes:
      - { min: 8, tag: slain, effect: { op: slay_monster, monster: $card, by: $self } }
      - { min: 5, max: 7, tag: spared, effect: { op: noop } }
      - { max: 4, tag: backfire, effect: { op: discard, target: $self, count: 2, chooser: $self } }
  on_slay: { op: noop }
  triggers:
    - on: card.drawn
      timing: post
      while_in: slain
      condition:
        op: all
        of:
          - { op: event_actor_is, player: $self }
          - { op: event_matches, kind_in: [magic] }
      effect:
        op: optional
        chooser: $self
        prompt: "Orthus: play that Magic card immediately?"
        effect:
          op: play_card_from_hand
          card: $event.card
          kind: magic
          challengeable: false

