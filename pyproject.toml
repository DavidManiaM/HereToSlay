[project]
name = "here-to-slay"
version = "0.1.0"
description = "A moddable, data-driven engine for Here to Slay and its variants"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "moderngl>=5.12.0",
    "pydantic>=2.13.4",
    "pygame-ce>=2.5.8",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
hts = "here_to_slay.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/here_to_slay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",   # pydantic-style defaults in signatures
    "SIM108", # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
